<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Game Day Notifications</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        img {
            width: 100%;
            max-width: 700px;
            margin-top: 20px;
        }
        .subscribe-form {
            margin-top: 20px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NBA Game Day Notifications</h1>
        <p>Stay updated with real-time NBA game scores via SMS or Email.</p>
        
        <h2>Project Overview</h2>
        <p>This system uses AWS Lambda, Amazon SNS, and EventBridge to fetch and send live NBA game scores to subscribers.</p>
        
        <h2>System Architecture</h2>
        <img src="./images/nba.png" alt="NBA Notification System Architecture">
        
        <h2>Subscribe for Alerts</h2>
        <form class="subscribe-form">
            <input type="text" placeholder="Enter your email or phone" required>
            <button type="submit">Subscribe</button>
        </form>
    </div>
</body>
</html>
